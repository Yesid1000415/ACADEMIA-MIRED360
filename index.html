<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ACADEMIA MIRED360</title>
<style>*{box-sizing:border-box}body{font:16px system-ui;margin:0;background:#f3f6fb;color:#172c4a}header{background:#102d60;color:#fff;padding:28px 18px}header h1{margin:0;font-size:27px}main{max-width:900px;margin:25px auto;padding:0 16px}.card{background:#fff;border-radius:16px;padding:22px;margin:15px 0;box-shadow:0 3px 18px #172c4a14}input,textarea,button{font:inherit;width:100%;padding:13px;border-radius:9px;margin:7px 0;border:1px solid #cbd5e1}button{background:#1357b3;color:white;border:0;cursor:pointer}button:disabled{opacity:.5}.muted{color:#66768a}details{padding:12px 0;border-bottom:1px solid #e3eaf2}summary{font-weight:600;cursor:pointer}article{white-space:pre-line;line-height:1.7;margin:18px 0}#campus{display:none}.error{color:#b42318}#logout{max-width:170px}</style></head><body><header><h1>ACADEMIA MIRED360</h1><div>Marketing digital e inteligencia artificial · 6 módulos · 30 clases</div></header><main><section class="card" id="login"><h2>Ingresar al campus</h2><p class="muted">Acceso para estudiantes y administradores autorizados.</p><form id="loginForm"><input id="email" type="email" autocomplete="email" placeholder="Correo electrónico" required><input id="password" type="password" autocomplete="current-password" placeholder="Contraseña" required><button>Ingresar</button></form><p id="message" class="error"></p><p class="muted">¿No tienes contraseña? Solicita una invitación al administrador. No compartas tus claves.</p></section><section id="campus"><div class="card"><h2 id="courseTitle">Mis clases</h2><p id="counter"></p><button id="logout">Cerrar sesión</button></div><div id="modules"></div></section></main>
<script>
const BASE='https://vdnimhchsubozhogfvtv.supabase.co',KEY='sb_publishable_YiDio01MaZPndBEgWSZLGA_qPKsteTZ';let token='',userId='';const $=id=>document.getElementById(id);
async function api(path,options={}){const response=await fetch(BASE+path,{...options,headers:{apikey:KEY,Authorization:'Bearer '+(token||KEY),'Content-Type':'application/json',...(options.headers||{})}});const raw=await response.text();let data;try{data=raw?JSON.parse(raw):null}catch{throw Error('Respuesta inesperada del servidor')}if(!response.ok)throw Error(data?.msg||data?.message||data?.error_description||'Error '+response.status);return data}
function textNode(tag,text){let el=document.createElement(tag);el.textContent=text;return el}
$('loginForm').onsubmit=async e=>{e.preventDefault();$('message').textContent='';const btn=e.target.querySelector('button');btn.disabled=true;try{const result=await api('/auth/v1/token?grant_type=password',{method:'POST',body:JSON.stringify({email:$('email').value.trim(),password:$('password').value})});token=result.access_token;userId=result.user.id;$('password').value='';await load()}catch(err){$('message').textContent=err.message}finally{btn.disabled=false}};
async function load(){const courses=await api('/rest/v1/courses?select=id,title&published=eq.true&limit=1');if(!courses.length)throw Error('No hay cursos publicados');const course=courses[0];let enroll=await api('/rest/v1/enrollments?select=course_id&user_id=eq.'+userId+'&course_id=eq.'+course.id);if(!enroll.length)await api('/rest/v1/enrollments',{method:'POST',headers:{Prefer:'return=minimal'},body:JSON.stringify({user_id:userId,course_id:course.id})});const mods=await api('/rest/v1/modules?select=id,title,position&course_id=eq.'+course.id+'&order=position.asc');const lessons=await api('/rest/v1/lessons?select=id,module_id,title,content,assignment,position&published=eq.true&order=position.asc');const progress=await api('/rest/v1/lesson_progress?select=lesson_id&user_id=eq.'+userId);const done=new Set(progress.map(p=>p.lesson_id));$('login').style.display='none';$('campus').style.display='block';$('courseTitle').textContent=course.title;const update=()=>$('counter').textContent='Clases estudiadas: '+done.size+' de '+lessons.length;update();$('modules').replaceChildren();for(const mod of mods){const card=textNode('section','');card.className='card';card.append(textNode('h2','Módulo '+mod.position+' · '+mod.title));for(const lesson of lessons.filter(l=>l.module_id===mod.id)){const details=document.createElement('details');details.append(textNode('summary',lesson.position+'. '+lesson.title));details.append(textNode('article',lesson.content||'Contenido pendiente'),textNode('h3','Actividad'),textNode('p',lesson.assignment||'Actividad pendiente'));const textarea=document.createElement('textarea');textarea.rows=5;textarea.placeholder='Desarrolla aquí tu actividad';details.append(textarea);const send=textNode('button','Enviar actividad');send.onclick=async()=>{if(textarea.value.trim().length<10){alert('Escribe al menos 10 caracteres.');return}send.disabled=true;try{await api('/rest/v1/submissions',{method:'POST',headers:{Prefer:'return=minimal'},body:JSON.stringify({user_id:userId,lesson_id:lesson.id,body:textarea.value.trim()})});textarea.value='';alert('Actividad guardada. Pendiente de revisión.')}catch(err){alert(err.message)}finally{send.disabled=false}};details.append(send);const mark=textNode('button',done.has(lesson.id)?'Clase registrada':'Marcar como estudiada');mark.disabled=done.has(lesson.id);mark.onclick=async()=>{mark.disabled=true;try{await api('/rest/v1/lesson_progress',{method:'POST',headers:{Prefer:'return=minimal'},body:JSON.stringify({user_id:userId,lesson_id:lesson.id})});done.add(lesson.id);mark.textContent='Clase registrada';update()}catch(err){mark.disabled=false;alert(err.message)}};details.append(mark);card.append(details)}$('modules').append(card)}}
$('logout').onclick=async()=>{try{await api('/auth/v1/logout',{method:'POST'})}catch{}token='';userId='';$('campus').style.display='none';$('login').style.display='block'};
</script></body></html>
